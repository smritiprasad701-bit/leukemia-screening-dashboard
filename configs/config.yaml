seed: 42

data:
  raw_dir: "data/raw"                 # C-NMC 2019 extracted here (see data/README.md)
  processed_dir: "data/processed"
  split_manifest: "data/processed/split_manifest.csv"   # created by split_patient_level.py
  image_size: 224
  num_classes: 2
  class_names: ["hem", "all"]         # 0 = hem (normal), 1 = all (leukemic blast)
  val_fraction: 0.15                  # of TRAIN subjects, held out as validation (subject-level)
  test_fraction: 0.15                 # of ALL subjects, held out as test (subject-level)

dataloader:
  batch_size: 32
  num_workers: 4
  pin_memory: true

training:
  epochs: 25
  lr: 0.0003
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"                 # options: cosine, step, none
  early_stopping_patience: 6
  amp: true                            # mixed precision
  freeze_backbone_epochs: 3           # epochs with backbone frozen before fine-tuning
  loss: "weighted_ce"                 # options: ce, weighted_ce, focal
  focal_gamma: 2.0
  checkpoint_dir: "models"

model:
  baseline_arch: "resnet50"
  advanced_arch: "efficientnet_b0"    # timm model name; also try "vit_small_patch16_224"
  dropout: 0.3
  pretrained: true

evaluation:
  outputs_dir: "outputs"
  low_confidence_threshold: 0.65      # below this max-softmax prob -> flag for human review

gradcam:
  target_layer:
    resnet50: "layer4"
    efficientnet_b0: "conv_head"
